spring:
  datasource:
    url: jdbc:h2:mem:inseoul;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate.dialect: org.hibernate.dialect.H2Dialect
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

ai:
  internal:
    base-url: http://localhost:8000

jwt:
  secret: test-secret-key-for-testing-only-must-be-32chars
  access-expiry-seconds: 1800
  refresh-expiry-days: 7
