name: Hermes seed backlog

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "실제 생성 (체크 해제 시 dry-run 제안만)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hermes-seed
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Seed backlog (dry-run unless apply)
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: NSLPRJCT
          SEED_APPLY: ${{ inputs.apply }}
        run: node scripts/hermes/seed-backlog.mjs
