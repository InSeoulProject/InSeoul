name: Hermes PM digest

on:
  schedule:
    # 평일 00:00 UTC = 09:00 KST
    - cron: "0 0 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: hermes
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Hermes digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GMS_KEY: ${{ secrets.GMS_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          HERMES_MODEL: claude-sonnet-4-6
          # 기본 base URL은 스크립트에 내장(SSAFY GMS 프록시). 바뀌면 아래 주석 해제:
          # LLM_BASE_URL: https://gms.ssafy.io/gmsapi/api.anthropic.com/v1/messages
        run: node scripts/hermes/digest.mjs
